<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1sleTravel.com</title>
<style>
:root{--bg:#f6f9fa;--card:#fff;--ink:#14282f;--mute:#5b6f76;--line:#d5e2e6;--acc:#0b7a8a;--accbg:#e3f3f5;--slot:#eef4f6;--note:#fff6e0;--notec:#7a5a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1e;--card:#15262b;--ink:#e6f0f2;--mute:#9bb0b6;--line:#274149;--acc:#4cc3d4;--accbg:#14343a;--slot:#1a2e34;--note:#33290f;--notec:#f0cf7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a1e;--card:#15262b;--ink:#e6f0f2;--mute:#9bb0b6;--line:#274149;--acc:#4cc3d4;--accbg:#14343a;--slot:#1a2e34;--note:#33290f;--notec:#f0cf7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:relative;overflow:hidden;padding:36px 20px 28px;text-align:center;background:var(--accbg);border-bottom:1px solid var(--line)}
.hbg{position:absolute;inset:0;background-size:cover;background-position:center}
.hin{position:relative}
.logo{width:150px;height:150px;border-radius:24px;object-fit:cover;box-shadow:0 6px 20px rgba(0,0,0,.3);margin-bottom:14px}
header.has h1,header.has p{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.hbtns{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:2}
.hbtn{font-size:.8rem;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.88);color:#14282f;cursor:pointer;border:0;font-family:inherit}
.hbtn.x{display:none}header.has .hbtn.x{display:inline-block}
header h1{margin:0 0 6px;font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.15}
header p{margin:0;color:var(--mute)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;justify-content:center;padding:10px;background:var(--bg);border-bottom:1px solid var(--line)}
nav a{padding:6px 16px;border-radius:99px;border:1px solid var(--line);color:var(--acc);text-decoration:none;font-weight:600;font-size:.95rem}
main{max-width:820px;margin:0 auto;padding:12px 16px 60px}
h2{margin:44px 0 18px;font-size:1.6rem;padding-bottom:8px;border-bottom:3px solid var(--acc)}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.time{display:inline-block;background:var(--accbg);color:var(--acc);font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:99px;margin-bottom:6px}
.opt{margin-left:6px;font-size:.75rem;font-weight:700;color:var(--notec);background:var(--note);padding:2px 8px;border-radius:99px}
.act+.act{margin-top:14px}
.act h3{margin:2px 0 8px;font-size:1.2rem}
.act p{margin:6px 0}
.act h4{margin:12px 0 2px;font-size:.95rem;color:var(--acc)}
.act ul{margin:4px 0 6px;padding-left:20px}
.act li{margin:2px 0}
.note{margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--note);color:var(--notec);font-size:.9rem}
.slot{display:block;margin:16px 0;cursor:pointer}
.slot input{display:none}
.slot .ph{display:flex;align-items:center;justify-content:center;min-height:220px;border:2px dashed var(--line);border-radius:14px;background:var(--slot);color:var(--mute);font-size:.95rem;text-align:center;padding:12px}
.slot.has .ph{display:none}
.media{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.media img,.media video{width:100%;border-radius:12px;display:block;background:#000}
</style>
</head>

<script>
var D=[
{t:"Day 1",a:[
{t:"5:00 – 7:00 AM",h:"Pick-up at My Dinh Bus Station",p:"Our 16-seat vehicle arrives at 5:00 AM. The group gathers at the meeting point before departure at 7:00 AM. Vehicle: air-conditioned 16-seat vehicle with comfortable seats and sufficient luggage space.",h4:"Before departure",l:["The tour guide checks attendance and confirms all participants are present.","Assists with loading and arranging luggage."]},
{t:"7:00 – 10:30 AM",h:"Transfer from Hanoi to Ao Tien Port",p:"Travel to Ao Tien Port in Van Don, Quang Ninh, via the Hanoi – Ha Long – Van Don Expressway.",h4:"On the way",l:["Brief introduction to Van Don and Thanh Lan Island.","Review of the day’s itinerary, transportation and planned activities.","Brochures with maps, key attractions and activities on Thanh Lan Island.","Scenic spots highlighted along the way."]},
{ns:1,t:"10:30 – 11:15 AM",h:"Light refreshments and rest at the port",p:"Arrive at Ao Tien Port and prepare for the speedboat transfer.",l:["Guide assists with luggage and gathering at the meeting point.","Light refreshments: sandwiches, fresh fruit and bottled water.","Boat tickets and passenger information checked.","Boarding and departure details confirmed."]},
{t:"11:15 AM – 1:00 PM",h:"Speedboat to Thanh Lan Island",p:"Board the speedboat at Ao Tien Port.",h4:"During the journey",l:["Panoramic views of Bai Tu Long Bay and surrounding islands.","Photos of the coastal scenery.","Brief information on the island’s geography and local fishing communities."]},
{t:"1:00 – 3:30 PM",h:"Homestay check-in, lunch and rest",p:"Arrive at the homestay and check in. Enjoy lunch with local dishes, then free time to rest before the afternoon."},
{t:"3:30 – 5:30 PM",h:"Swim and sightsee at Ba Chau Beach",p:"Explore the natural highlights of Ba Chau Beach.",h4:"White sandy beach",l:["Stroll the 1 km+ stretch of fine white sand with crystal-clear water and a gently sloping shore.","Swim, relax by the sea and take photos.","Experience the tranquil island atmosphere away from crowded tourist areas."],h4b:"Rock formations and primeval forest",lb:["Explore distinctive rock formations at both ends of the beach, shaped by waves and time.","Admire the lush primeval forest and silverberry trees."],h4c:"Green meadows and wildflowers",lc:["Discover green grassy areas and clusters of purple wildflowers around Ba Chau Bay.","Capture photos of the picturesque landscape."]},
{ns:1,t:"5:30 – 6:30 PM",h:"Return to the homestay and freshen up",p:"Return to the homestay, shower and freshen up before dinner."},
{t:"6:30 – 8:30 PM",h:"Dinner",p:"Fresh seafood and regional specialties at a local restaurant."},
{t:"9:00 – 11:00 PM",o:1,h:"Seafood catching with local fishermen",p:"Experience the local fishing lifestyle.",l:["Meet local fishermen and learn about their daily work.","Learn traditional seafood-catching practices around the island.","Join a guided seafood-catching experience using methods provided by the fishermen."],n:"Not included in the tour price; subject to local arrangements and weather conditions."}
]},
{t:"Day 2",a:[
{t:"5:00 – 6:00 AM",o:1,h:"Sunrise at Dragon’s Claw Beach",p:"Watch the sunrise and admire the coastal scenery."},
{t:"6:00 – 8:00 AM",h:"Breakfast",p:"Return to the homestay for breakfast before the day’s activities."},
{t:"8:00 – 9:00 AM",h:"Travel to Ngoc Trai Beach and photo stop",p:"Travel from the homestay (8:00 – 8:30), enjoying the coastal scenery. Then check in and take photos (8:30 – 9:00).",l:["Admire the clear blue seawater and relatively untouched landscape.","Group photos and seaside views."]},
{t:"9:00 – 11:00 AM",o:1,h:"Coral reef snorkeling and water activities",p:"Experience the underwater ecosystem at Ngoc Trai Beach.",l:["Guided snorkeling to observe coral reefs and marine life.","Learn about the local coral ecosystem and conservation efforts.","Other activities such as kayaking, SUP or fishing, depending on services provided.","Equipment and safety instructions from trained staff."],n:"These activities are not included in the tour price."},
{ns:1,t:"11:00 AM – 2:00 PM",h:"Return to Thanh Lan Island, lunch and rest",p:"Return to the island, have lunch and rest before the afternoon sightseeing."},
{t:"2:00 – 2:45 PM",h:"Thanh Lan Parish Church",p:"Originally established in 2004 and rebuilt into a larger structure in 2013.",l:["Explore the church grounds and coastal setting, with the sea in front and greenery around.","Take photographs and learn about the church’s history and role in the local Catholic community."]},
{t:"2:45 – 4:10 PM",h:"C76 Beach",p:"Travel to C76 Beach (2:45 – 3:00), then 1 hour 10 minutes on the beach (3:00 – 4:10).",l:["Explore this relatively untouched beach and its crescent-shaped sandy coves.","Admire the rocky formations separating the coves.","Enjoy sea views, relax by the shore and take photos."]},
{t:"4:30 – 5:30 PM",h:"Mai Cong Dam Jellyfish Workshop",p:"Travel from C76 Beach (4:10 – 4:30), then a one-hour workshop visit.",h4:"1 · Introduction to the local jellyfish industry (10 min)",l:["Meet the workshop owner or workers and learn the history of jellyfish processing on the island.","Discover the harvesting season, local fishing practices and the industry’s importance to livelihoods."],h4b:"2 · The processing process (20 min)",lb:["Observe how fresh jellyfish are sorted and cleaned.","Learn about soaking and preservation in saltwater.","Watch how processed jellyfish are drained, sorted and prepared for packaging.","Listen to workers explain traditional techniques."],h4c:"3 · Hands-on experience (20 min)",lc:["Simple, supervised activities such as sorting prepared jellyfish or arranging packaging materials.","Learn how workers distinguish types and sizes.","Try basic packaging, if permitted by the workshop owner."],h4d:"4 · Local products and interaction (10 min)",ld:["Explore finished products and how they are used in traditional Vietnamese cuisine.","Ask workers about their experiences.","Purchase jellyfish products as souvenirs (optional)."],n:"Jellyfish processing is seasonal (usually the first to third or fourth lunar month). Off-season, the visit focuses on equipment, preservation methods, finished products and meeting local workers."},
{t:"6:00 PM onwards",h:"Dinner and free time",p:"Dinner with local seafood and specialties, then an evening at leisure.",l:["Arrange an electric car with a local driver to explore the island.","Enjoy the island’s nighttime atmosphere and local cuisine."]}
]},
{t:"Day 3",a:[
{t:"6:30 – 7:30 AM",h:"Breakfast",p:"Breakfast at the homestay and preparation for the final morning."},
{t:"7:30 – 10:00 AM",h:"Travel to and explore Vung Tron Beach",h4:"1 · Forest trail (25 min)",l:["Walk the winding ~400 m trail through pristine forest to the beach.","Fresh air, shaded pathways and lush greenery; photos along the way."],h4b:"2 · Beach exploration and relaxation (1 hour)",lb:["Explore this small, relatively untouched beach surrounded by greenery.","Walk the shoreline and enjoy the clear sky and sea breeze.","Photos, and free time to relax away from crowded tourist areas."],h4c:"3 · Return journey (15 min)",lc:["Gather belongings and prepare to leave.","Walk back along the forest trail to the pick-up point."]},
{ns:1,t:"10:00 – 11:00 AM",h:"Pack and check out",p:"Pack belongings, check out, settle any remaining payments and move luggage to the departure point."},
{t:"11:00 AM – 1:00 PM",h:"Boat transfer to Ao Tien Port",p:"Take the scheduled boat to Ao Tien Port, enjoy the sea views and collect luggage on arrival."},
{t:"1:00 – 3:00 PM",h:"Lunch and free time at Ao Tien Port",l:["Lunch at a local restaurant near the port.","A short break after the boat journey and free time before the return trip."]},
{t:"3:00 – 6:30 PM",h:"Transfer back to Hanoi",l:["Depart Ao Tien Port and travel back to Hanoi by pre-arranged transport.","Arrive in Hanoi and end the trip. Guests then make their own way home."]}
]}];

var out="";
D.forEach(function(d,i){
out+='<h2 id="day'+(i+1)+'">'+d.t+'</h2>';
d.a.forEach(function(a){
var s='<article class="act"><span class="time">'+a.t+'</span>'+(a.o?'<span class="opt">OPTIONAL</span>':'')+'<h3>'+a.h+'</h3>';
if(a.p)s+='<p>'+a.p+'</p>';
s+=(a.h4?'<h4>'+a.h4+'</h4>':'')+ul(a.l);
s+=(a.h4b?'<h4>'+a.h4b+'</h4>':'')+ul(a.lb);
s+=(a.h4c?'<h4>'+a.h4c+'</h4>':'')+ul(a.lc);
s+=(a.h4d?'<h4>'+a.h4d+'</h4>':'')+ul(a.ld);
if(a.n)s+='<div class="note"><b>Note:</b> '+a.n+'</div>';
out+=s+'</article>'+(a.ns?'':slot());
});
});
document.getElementById("app").innerHTML=out;
document.querySelectorAll(".slot input").forEach(function(inp){
inp.addEventListener("change",function(){
var box=inp.parentNode.querySelector(".media");
Array.prototype.forEach.call(inp.files,function(f){
var v=f.type.indexOf("video")==0,e=document.createElement(v?"video":"img");
e.src=URL.createObjectURL(f);if(v)e.controls=true;box.appendChild(e);
});
if(inp.files.length)inp.parentNode.classList.add("has");
});
});
var hero=document.getElementById("hero"),hb=hero.querySelector(".hbg");
document.getElementById("hbgin").addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;hb.style.backgroundImage="linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.5)),url("+URL.createObjectURL(f)+")";hero.classList.add("has")});
document.getElementById("hbgx").addEventListener("click",function(){hb.style.backgroundImage="";hero.classList.remove("has")});
</script>
</body>
</html>
